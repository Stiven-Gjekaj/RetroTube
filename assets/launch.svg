<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <!-- The launch image of iOS 6 covers the screen under the status bar: a
       navigation bar and an empty white table. -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0bccd"/>
      <stop offset="0.5" stop-color="#889bb3"/>
      <stop offset="0.5" stop-color="#8195af"/>
      <stop offset="1" stop-color="#6d83a2"/>
    </linearGradient>
  </defs>
  <rect width="320" height="480" fill="#ffffff"/>
  <rect y="0" width="320" height="20" fill="#000000"/>
  <rect y="20" width="320" height="44" fill="url(#bar)"/>
  <rect y="63" width="320" height="1" fill="#2d3642"/>
</svg>
