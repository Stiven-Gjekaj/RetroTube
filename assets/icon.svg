  <line x1="256" y1="132" x2="176" y2="52" stroke="#c9ccd1" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="132" x2="336" y2="52" stroke="#c9ccd1" stroke-width="14" stroke-linecap="round"/>
